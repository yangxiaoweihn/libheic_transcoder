name: Build Native

on:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

jobs:
  # ===========================================================================
  # macOS x86_64
  # ===========================================================================
  build-macos-x86_64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Install cmake
        run: brew install cmake
      - name: Build libde265
        run: |
          git clone --depth 1 --branch v1.0.15 https://github.com/strukturag/libde265.git
          cd libde265 && mkdir build && cd build
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/vendor \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_SDL=OFF ..
          make -j$(sysctl -n hw.ncpu) && make install
      - name: Build x265
        run: |
          git clone --depth 1 --branch 4.1 https://bitbucket.org/multicoreware/x265_git.git
          cd x265_git/source
          sed -i '' '/cmake_policy(SET CMP0025 OLD)/d' CMakeLists.txt
          sed -i '' '/cmake_policy(SET CMP0054 OLD)/d' CMakeLists.txt
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/vendor \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF \
            -DHIGH_BIT_DEPTH=OFF -DENABLE_HDR10_PLUS=OFF .
          make -j$(sysctl -n hw.ncpu) && make install
      - name: Stub pkgconfig
        run: |
          mkdir -p vendor/lib/pkgconfig
          printf 'Name: libjpeg\nDescription: stub\nVersion: 0\nLibs:\nCflags:\n' > vendor/lib/pkgconfig/libjpeg.pc
          printf 'Name: libsharpyuv\nDescription: stub\nVersion: 0\nLibs:\nCflags:\n' > vendor/lib/pkgconfig/libsharpyuv.pc
      - name: Create cmake wrapper
        run: |
          mkdir -p $GITHUB_WORKSPACE/bin
          cat > $GITHUB_WORKSPACE/bin/cmake << 'EOF'
          #!/bin/bash
          for arg in "$@"; do
            if [[ "$arg" == "--build" ]] || [[ "$arg" == "--install" ]]; then
              exec /opt/homebrew/bin/cmake "$@"
            fi
          done
          exec /opt/homebrew/bin/cmake "$@" -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_WebP=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_LIBSHARPYUV=TRUE
          EOF
          chmod +x $GITHUB_WORKSPACE/bin/cmake
      - name: Build
        env:
          CMAKE: ${{ github.workspace }}/bin/cmake
          PKG_CONFIG_PATH: ${{ github.workspace }}/vendor/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/vendor/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CC_x86_64_apple_darwin: clang
          CXX_x86_64_apple_darwin: clang++
          CFLAGS_x86_64_apple_darwin: -arch x86_64 -mmacosx-version-min=11.0
          CXXFLAGS_x86_64_apple_darwin: -arch x86_64 -mmacosx-version-min=11.0
          LDFLAGS_x86_64_apple_darwin: -arch x86_64
        run: cargo build --release --target x86_64-apple-darwin
      - name: Verify
        run: |
          file target/x86_64-apple-darwin/release/libheic_transcoder.dylib
          nm -gU target/x86_64-apple-darwin/release/libheic_transcoder.dylib | grep -E 'jpeg_to_heic_with_uuid|heic_to_jpeg|heic_free'
      - uses: actions/upload-artifact@v4
        with:
          name: libheic_transcoder-macos-x86_64
          path: target/x86_64-apple-darwin/release/libheic_transcoder.dylib

  # ===========================================================================
  # macOS arm64
  # ===========================================================================
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install cmake
        run: brew install cmake
      - name: Build libde265
        run: |
          git clone --depth 1 --branch v1.0.15 https://github.com/strukturag/libde265.git
          cd libde265 && mkdir build && cd build
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/vendor \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_SDL=OFF ..
          make -j$(sysctl -n hw.ncpu) && make install
      - name: Build x265
        run: |
          git clone --depth 1 --branch 4.1 https://bitbucket.org/multicoreware/x265_git.git
          cd x265_git/source
          sed -i '' '/cmake_policy(SET CMP0025 OLD)/d' CMakeLists.txt
          sed -i '' '/cmake_policy(SET CMP0054 OLD)/d' CMakeLists.txt
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/vendor \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DENABLE_ASSEMBLY=OFF \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF \
            -DHIGH_BIT_DEPTH=OFF -DENABLE_HDR10_PLUS=OFF .
          make -j$(sysctl -n hw.ncpu) && make install
      - name: Stub pkgconfig
        run: |
          mkdir -p vendor/lib/pkgconfig
          printf 'Name: libjpeg\nDescription: stub\nVersion: 0\nLibs:\nCflags:\n' > vendor/lib/pkgconfig/libjpeg.pc
          printf 'Name: libsharpyuv\nDescription: stub\nVersion: 0\nLibs:\nCflags:\n' > vendor/lib/pkgconfig/libsharpyuv.pc
      - name: Create cmake wrapper
        run: |
          mkdir -p $GITHUB_WORKSPACE/bin
          cat > $GITHUB_WORKSPACE/bin/cmake << 'EOF'
          #!/bin/bash
          for arg in "$@"; do
            if [[ "$arg" == "--build" ]] || [[ "$arg" == "--install" ]]; then
              exec /opt/homebrew/bin/cmake "$@"
            fi
          done
          exec /opt/homebrew/bin/cmake "$@" -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_WebP=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_LIBSHARPYUV=TRUE
          EOF
          chmod +x $GITHUB_WORKSPACE/bin/cmake
      - name: Build
        env:
          CMAKE: ${{ github.workspace }}/bin/cmake
          PKG_CONFIG_PATH: ${{ github.workspace }}/vendor/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/vendor/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CC_aarch64_apple_darwin: clang
          CXX_aarch64_apple_darwin: clang++
          CFLAGS_aarch64_apple_darwin: -arch arm64 -mmacosx-version-min=11.0
          CXXFLAGS_aarch64_apple_darwin: -arch arm64 -mmacosx-version-min=11.0
          LDFLAGS_aarch64_apple_darwin: -arch arm64
        run: cargo build --release --target aarch64-apple-darwin
      - name: Verify
        run: |
          file target/aarch64-apple-darwin/release/libheic_transcoder.dylib
          nm -gU target/aarch64-apple-darwin/release/libheic_transcoder.dylib | grep -E 'jpeg_to_heic_with_uuid|heic_to_jpeg|heic_free'
      - uses: actions/upload-artifact@v4
        with:
          name: libheic_transcoder-macos-arm64
          path: target/aarch64-apple-darwin/release/libheic_transcoder.dylib

  # ===========================================================================
  # macOS Universal（lipo 合并）
  # ===========================================================================
  build-macos-universal:
    runs-on: macos-14
    needs: [build-macos-x86_64, build-macos-arm64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libheic_transcoder-macos-x86_64
          path: artifacts/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: libheic_transcoder-macos-arm64
          path: artifacts/arm64
      - name: Merge with lipo
        run: |
          mkdir -p target/release
          lipo -create -output target/release/libheic_transcoder.dylib \
            artifacts/x86_64/libheic_transcoder.dylib \
            artifacts/arm64/libheic_transcoder.dylib
      - name: Verify
        run: |
          file target/release/libheic_transcoder.dylib
          lipo -info target/release/libheic_transcoder.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: libheic_transcoder-macos-universal
          path: target/release/libheic_transcoder.dylib

  # ===========================================================================
  # Windows x86_64
  # ===========================================================================
  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install cargo-vcpkg
        run: cargo install cargo-vcpkg
      - name: Build libheif via vcpkg
        run: cargo vcpkg -v build
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      - name: Build
        env:
          VCPKG_ROOT: ${{ github.workspace }}/target/vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Verify
        run: |
          dir target\x86_64-pc-windows-msvc\release\heic_transcoder.dll
          dumpbin /exports target\x86_64-pc-windows-msvc\release\heic_transcoder.dll | findstr "jpeg_to_heic_with_uuid heic_to_jpeg heic_free"
      - uses: actions/upload-artifact@v4
        with:
          name: heic_transcoder-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/heic_transcoder.dll

  # ===========================================================================
  # Windows arm64
  # ===========================================================================
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Install cargo-vcpkg
        run: cargo install cargo-vcpkg
      - name: Build libheif via vcpkg
        run: cargo vcpkg -v build
        env:
          VCPKG_DEFAULT_TRIPLET: arm64-windows-static-md
      - name: Build
        env:
          VCPKG_ROOT: ${{ github.workspace }}/target/vcpkg
          VCPKG_DEFAULT_TRIPLET: arm64-windows-static-md
        run: cargo build --release --target aarch64-pc-windows-msvc
      - name: Verify
        run: |
          dir target\aarch64-pc-windows-msvc\release\heic_transcoder.dll
          dumpbin /exports target\aarch64-pc-windows-msvc\release\heic_transcoder.dll | findstr "jpeg_to_heic_with_uuid heic_to_jpeg heic_free"
      - uses: actions/upload-artifact@v4
        with:
          name: heic_transcoder-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/heic_transcoder.dll