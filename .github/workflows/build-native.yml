name: Build Native

on:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

jobs:
  build-x86_64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install cmake
        run: brew install cmake

      - name: Build libde265 for x86_64
        run: |
          git clone --depth 1 --branch v1.0.15 \
            https://github.com/strukturag/libde265.git
          cd libde265
          mkdir build && cd build
          cmake \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/vendor \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_SDL=OFF \
            ..
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Stub pkgconfig
        run: |
          mkdir -p vendor/lib/pkgconfig
          cat > vendor/lib/pkgconfig/libjpeg.pc << 'EOF'
          Name: libjpeg
          Description: stub
          Version: 0
          Libs:
          Cflags:
          EOF
          cat > vendor/lib/pkgconfig/libsharpyuv.pc << 'EOF'
          Name: libsharpyuv
          Description: stub
          Version: 0
          Libs:
          Cflags:
          EOF

      - name: Create cmake wrapper
        run: |
          mkdir -p $GITHUB_WORKSPACE/bin
          cat > $GITHUB_WORKSPACE/bin/cmake << 'EOF'
          #!/bin/bash
          for arg in "$@"; do
            if [[ "$arg" == "--build" ]] || [[ "$arg" == "--install" ]]; then
              exec /opt/homebrew/bin/cmake "$@"
            fi
          done
          exec /opt/homebrew/bin/cmake "$@" \
            -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_WebP=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_LIBSHARPYUV=TRUE
          EOF
          chmod +x $GITHUB_WORKSPACE/bin/cmake

      - name: Build
        env:
          CMAKE: ${{ github.workspace }}/bin/cmake
          PKG_CONFIG_PATH: ${{ github.workspace }}/vendor/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/vendor/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CC: clang -arch x86_64
          CXX: clang++ -arch x86_64
          CFLAGS: -arch x86_64
          CXXFLAGS: -arch x86_64
          LDFLAGS: -arch x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Verify
        run: |
          file target/x86_64-apple-darwin/release/libheic_transcoder.dylib
          nm -gU target/x86_64-apple-darwin/release/libheic_transcoder.dylib | grep -i de265 | head

      - uses: actions/upload-artifact@v4
        with:
          name: libheic_transcoder-macos-x86_64
          path: target/x86_64-apple-darwin/release/libheic_transcoder.dylib
